name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}, Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    # Windows is experimental: repo-fit has not been run there by hand. A red Windows job is allowed
    # until someone has looked at it. macOS and Linux must be green.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Versions
        run: |
          node --version
          git --version
      - name: Tests
        # A test that hangs fails by name after 5 minutes, instead of the whole job running out of time.
        # Node 18 has no --test-timeout, so it runs without it.
        shell: bash
        run: |
          if node -e 'process.exit(Number(process.versions.node.split(".")[0]) >= 20 ? 0 : 1)'; then node --test --test-timeout=300000; else node --test; fi
